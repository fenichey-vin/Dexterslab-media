<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Media Intel Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="/media/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <div id="commit-banner" class="commit-banner hidden">PLEASE WAIT — COMMIT IN PROGRESS</div>

  <div id="makemkv-banner" class="makemkv-banner hidden">
    <span id="makemkv-banner-text">MakeMKV needs an update — rips and scans will fail until updated.</span>
    <button id="makemkv-update-btn" onclick="updateMakemkv()">Update MakeMKV</button>
  </div>

  <header class="site-header">
    <a href="/media/" class="logo">
      <span class="logo-icon">◈</span>
      <span>Media Intel</span>
    </a>
    <div class="global-search">
      <input type="text" id="global-search-input" class="search-input"
             placeholder="Search ripped titles…" autocomplete="off">
      <div id="global-search-results" class="search-results hidden"></div>
    </div>
    <nav class="header-nav">
      <a href="/media/" class="nav-link">Dashboard</a>
    </nav>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <script src="/media/static/app.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
